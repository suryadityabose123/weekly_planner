<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Planner</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Weekly Planner</h1>


    <button id="set-day">SET DAY</button>

    <button id="clear-day">CLEAR DAY</button>

    <button id="rest-day">REST DAY</button>

<div id="starting-slots-control">

    <label for="starting-slots">
        Starting slots:
    </label>

    <input
        type="number"
        id="starting-slots"
        min="0"
        value="0"
    >

    <button id="set-starting-slots">
        SET STARTING SLOTS
    </button>

</div>
    
    <div id="residual-display">

        <p>
            Normal residual:
            <span id="normal-residual">-</span>
        </p>

        <p>
            Creative residual:
            <span id="creative-residual">-</span>
        </p>

    </div>

    <!-- Day navigation -->

    <div class="day-navigation">

        <button id="previous-day">←</button>

        <span id="current-day">{{ today }}</span>

        <button id="next-day">→</button>

    </div>
    

    <!-- The seven independent day pages -->

    <div class="planner">

        {% for day in timetable.week_df.columns %}

        <div class="day-page" data-day="{{ day }}">

<table class="planner-table">

    <thead>
        <tr>
            <th>Time</th>
            <th>Slot</th>
        </tr>
    </thead>

    <tbody>

        {% for hour in range(24) %}

        <tr>

            <td class="time-label">
                {{ timeslot_conv[hour * 4] }}
            </td>

            <td class="hour-slot">

                {% for quarter in range(4) %}

                    {% set slot = hour * 4 + quarter %}

                    <div
                    class="quarter-area planner-cell
                    {% if timetable.week_df[day].iloc[slot] == 1 %}
                        normal-slot
                    {% elif timetable.week_df[day].iloc[slot] == 2 %}
                        creative-slot
                    {% endif %}"

                    data-day="{{ day }}"
                    data-slot="{{ slot }}"
                     ></div>

                {% endfor %}

            </td>

        </tr>

        {% endfor %}

            </tbody>

        </table>

                </div>

                {% endfor %}

    </div>

<script>

console.log("SCRIPT LOADED");


// =========================================
// QUARTER CELLS
// =========================================

const cells =
    document.querySelectorAll(".quarter-area");

let isDragging = false;
let selectedCells = [];
let longPressTimer = null;
let isLongPress = false;
let activeTouchCell = null;


// =========================================
// GET STATE
// =========================================

function getState(cell) {

    if (cell.classList.contains("normal-slot")) {
        return "normal";
    }

    if (cell.classList.contains("creative-slot")) {
        return "creative";
    }

    return "empty";
}


// =========================================
// SET STATE
// =========================================

function setState(cell, state) {

    cell.classList.remove(
        "normal-slot",
        "creative-slot"
    );

    if (state === "normal") {

        cell.classList.add("normal-slot");

    }

    else if (state === "creative") {

        cell.classList.add("creative-slot");

    }

}


// =========================================
// CLEAR SELECTION
// =========================================

function clearSelection() {

    selectedCells.forEach(function(cell) {

        cell.classList.remove("selected-slot");

    });

    selectedCells = [];

}


// =========================================
// RIGHT-CLICK DRAG SELECTION
// =========================================

cells.forEach(function(cell) {
     
        const row = Number(cell.dataset.slot);

    if (row >= 92 || row < 28) {
        cell.classList.add("night-slot");
    }


    // =====================================
    // DISABLE NORMAL RIGHT-CLICK MENU
    // =====================================

    cell.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );


    // =====================================
    // MOUSE DOWN
    // =====================================

    cell.addEventListener(
        "mousedown",
        function(event) {

            // Only right mouse button

            if (event.button !== 2) {
                return;
            }


            event.preventDefault();


            // Start a new selection

            clearSelection();

            isDragging = true;


            cell.classList.add(
                "selected-slot"
            );

            selectedCells.push(cell);

        }
    );


    // =====================================
    // DRAG OVER CELLS
    // =====================================

    cell.addEventListener(
        "mouseenter",
        function() {

            if (!isDragging) {
                return;
            }


            if (!selectedCells.includes(cell)) {

                cell.classList.add(
                    "selected-slot"
                );

                selectedCells.push(cell);

            }

        }
    );


    // =====================================
    // LEFT CLICK
    // =====================================

    cell.addEventListener(
        "click",
        function() {


            // ---------------------------------
            // If a range is selected:
            // create merged block
            // ---------------------------------

            if (selectedCells.length > 0) {

                createMergedSlot(
                    selectedCells
                );

                return;

            }


            // ---------------------------------
            // Otherwise change single cell
            // ---------------------------------

            let state =
                getState(cell);


            if (state === "normal") {

                setState(
                    cell,
                    "creative"
                );

            }

            else if (state === "creative") {

                setState(
                    cell,
                    "empty"
                );

            }

            else {

                setState(
                    cell,
                    "normal"
                );

            }

        }
    );

});


// =========================================
// STOP RIGHT-CLICK DRAG
// =========================================

document.addEventListener(
    "mouseup",
    function(event) {

        if (event.button === 2) {

            isDragging = false;

        }

    }
);

// =========================================
// MOBILE LONG-PRESS SELECTION
// =========================================

cells.forEach(function(cell) {

    cell.addEventListener(
        "touchstart",
        function(event) {

            if (event.touches.length !== 1) {
                return;
            }

            activeTouchCell = cell;
            isLongPress = false;

            longPressTimer = setTimeout(
                function() {

                    isLongPress = true;

                    clearSelection();

                    isDragging = true;

                    cell.classList.add(
                        "selected-slot"
                    );

                    selectedCells.push(cell);


                    // Haptic feedback
                    if (navigator.vibrate) {

                        navigator.vibrate(50);

                    }

                },
                500
            );

        },
        { passive: true }
    );


    cell.addEventListener(
        "touchmove",
        function(event) {

            // Before long-press:
            // cancel selection and allow scrolling

            if (!isLongPress) {

                clearTimeout(longPressTimer);

                return;

            }


            event.preventDefault();


            const touch =
                event.touches[0];


            const element =
                document.elementFromPoint(
                    touch.clientX,
                    touch.clientY
                );


            if (
                element &&
                element.classList.contains(
                    "quarter-area"
                ) &&
                !selectedCells.includes(element)
            ) {

                element.classList.add(
                    "selected-slot"
                );

                selectedCells.push(element);

            }

        },
        { passive: false }
    );


    cell.addEventListener(
        "touchend",
        function(event) {

            clearTimeout(longPressTimer);

            isDragging = false;

            activeTouchCell = null;


            // Prevent the touch from becoming
            // an accidental normal click

            if (isLongPress) {

                event.preventDefault();

            }

        }
    );


    cell.addEventListener(
        "touchcancel",
        function() {

            clearTimeout(longPressTimer);

            isDragging = false;

            activeTouchCell = null;

        }
    );

});

// =========================================
// CREATE MERGED SLOT
// =========================================

function createMergedSlot(selected) {


    if (selected.length === 0) {
        return;
    }


    // =====================================
    // Sort by slot number
    // =====================================

    selected.sort(
        function(a, b) {

            return Number(a.dataset.slot)
                 - Number(b.dataset.slot);

        }
    );


    const firstCell =
        selected[0];

    const lastCell =
        selected[selected.length - 1];


    const dayPage =
        firstCell.closest(".day-page");


    // =====================================
    // NEW MERGED BLOCK = NORMAL
    // =====================================

    let state = "normal";


    // Underlying cells become NORMAL

    selected.forEach(
        function(cell) {

            setState(
                cell,
                "normal"
            );

        }
    );


    // =====================================
    // CREATE BLOCK
    // =====================================

    const mergedSlot =
        document.createElement("div");


    mergedSlot.classList.add(
        "merged-slot",
        "normal-slot"
    );


    // =====================================
    // CREATE TEXT AREA
    // =====================================

    const textarea =
        document.createElement("textarea");


    mergedSlot.appendChild(
        textarea
    );


    // =====================================
    // FIND POSITION
    // =====================================

    const firstRect =
        firstCell.getBoundingClientRect();


    const lastRect =
        lastCell.getBoundingClientRect();


    const pageRect =
        dayPage.getBoundingClientRect();


    const left =
        firstRect.left
        - pageRect.left;


    const top =
        firstRect.top
        - pageRect.top;


    const width =
        firstRect.width;


    const height =
        lastRect.bottom
        - firstRect.top;


    mergedSlot.style.left =
        left + "px";


    mergedSlot.style.top =
        top + "px";


    mergedSlot.style.width =
        width + "px";


    mergedSlot.style.height =
        height + "px";


    // =====================================
    // ADD BLOCK TO PAGE
    // =====================================

    dayPage.appendChild(
        mergedSlot
    );


    // =====================================
    // REMOVE SELECTION
    // =====================================

    selected.forEach(
        function(cell) {

            cell.classList.remove(
                "selected-slot"
            );

        }
    );


    selectedCells = [];


    // =====================================
    // RIGHT CLICK MERGED BLOCK
    //
    // NORMAL
    //     ↓
    // CREATIVE
    //     ↓
    // EMPTY
    //     ↓
    // NORMAL
    // =====================================

   mergedSlot.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();


        // =================================
        // NORMAL → CREATIVE
        // =================================

        if (state === "normal") {

            state = "creative";


            mergedSlot.classList.remove(
                "normal-slot"
            );

            mergedSlot.classList.add(
                "creative-slot"
            );


            selected.forEach(function(cell) {

                setState(
                    cell,
                    "creative"
                );

            });

            return;
        }


        // =================================
        // CREATIVE → EMPTY / UNMERGE
        // =================================

        if (state === "creative") {

            state = "empty";


            // Remove colour from underlying cells

            selected.forEach(function(cell) {

                setState(
                    cell,
                    "empty"
                );

            });


            // Remove the merged block

            mergedSlot.remove();


            // The original quarter cells
            // are now visible again

            return;
        }

    }
);


    // =====================================
    // LEFT CLICK TEXTAREA
    //
    // ONLY EDITS TEXT
    // =====================================

    textarea.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );


    textarea.addEventListener(
        "mousedown",
        function(event) {

            // Left mouse = text editing

            if (event.button === 0) {

                event.stopPropagation();

            }

        }
    );


    // =====================================
    // FOCUS TEXT AREA
    // =====================================

    textarea.focus();

    let mergedLongPressTimer = null;


mergedSlot.addEventListener(
    "touchstart",
    function() {

        mergedLongPressTimer = setTimeout(
            function() {

                // Vibrate

                if (navigator.vibrate) {

                    navigator.vibrate(50);

                }


                // Normal → Creative

                if (state === "normal") {

                    state = "creative";

                    mergedSlot.classList.remove(
                        "normal-slot"
                    );

                    mergedSlot.classList.add(
                        "creative-slot"
                    );


                    selected.forEach(function(cell) {

                        setState(
                            cell,
                            "creative"
                        );

                    });

                    return;

                }


                // Creative → Empty

                if (state === "creative") {

                    state = "empty";


                    selected.forEach(function(cell) {

                        setState(
                            cell,
                            "empty"
                        );

                    });


                    mergedSlot.remove();

                }

            },
            500
        );

    }
);


mergedSlot.addEventListener(
    "touchend",
    function() {

        clearTimeout(
            mergedLongPressTimer
        );

    }
);


mergedSlot.addEventListener(
    "touchmove",
    function() {

        clearTimeout(
            mergedLongPressTimer
        );

    }
);

}


// =========================================
// DAY NAVIGATION
// =========================================

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];


let currentDay =
    "{{ today }}";


const currentDayDisplay =
    document.getElementById(
        "current-day"
    );


const dayPages =
    document.querySelectorAll(
        ".day-page"
    );


function showDay(day) {

    dayPages.forEach(
        function(page) {

            if (
                page.dataset.day === day
            ) {

                page.style.display =
                    "block";

            }

            else {

                page.style.display =
                    "none";

            }

        }
    );


    currentDayDisplay.innerHTML =
        day;

}


showDay(currentDay);


// =========================================
// PREVIOUS DAY
// =========================================

document.getElementById(
    "previous-day"
).onclick = function() {

    let index =
        days.indexOf(
            currentDay
        );


    index =
        (
            index - 1 + days.length
        ) % days.length;


    currentDay =
        days[index];


    showDay(currentDay);

};


// =========================================
// NEXT DAY
// =========================================

document.getElementById(
    "next-day"
).onclick = function() {

    let index =
        days.indexOf(
            currentDay
        );


    index =
        (
            index + 1
        ) % days.length;


    currentDay =
        days[index];


    showDay(currentDay);

};


// =========================================
// FIND CONTIGUOUS RANGES
// =========================================

function findRanges(
    currentCells,
    className
) {

    const ranges = [];


    let start = null;
    let previousSlot = null;


    currentCells.forEach(
        function(cell) {

            const slot =
                Number(
                    cell.dataset.slot
                );


            const hasType =
                cell.classList.contains(
                    className
                );


            if (hasType) {


                if (start === null) {

                    start = slot;

                }


                previousSlot =
                    slot;

            }


            else {


                if (start !== null) {

                    ranges.push({

                        start: start,

                        end:
                            previousSlot + 1

                    });


                    start = null;

                    previousSlot = null;

                }

            }

        }
    );


    // Final range

    if (start !== null) {

        ranges.push({

            start: start,

            end:
                previousSlot + 1

        });

    }


    return ranges;

}


// =========================================
// CONVERT SLOTS TO TIME
// =========================================

function slotsToTime(slots) {

    const totalMinutes =
        slots * 15;


    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    return `${hours}:${minutes
        .toString()
        .padStart(2, "0")}`;

}


// =========================================
// SET DAY
// =========================================

document.getElementById(
    "set-day"
).onclick = function() {


    console.log(
        "SET DAY clicked"
    );


    const currentCells =
        document.querySelectorAll(
            `.quarter-area[data-day="${currentDay}"]`
        );


    const normalRanges =
        findRanges(
            currentCells,
            "normal-slot"
        );


    const creativeRanges =
        findRanges(
            currentCells,
            "creative-slot"
        );


    const data = {

        day: currentDay,

        normal_ranges:
            normalRanges,

        creative_ranges:
            creativeRanges

    };


    console.log(
        "Sending to Python:",
        data
    );


    fetch(
        "/set_day",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(data)

        }
    )


    .then(
        function(response) {

            return response.json();

        }
    )


    .then(
        function(data) {

            console.log(
                "Python response:",
                data
            );


            document.getElementById(
                "normal-residual"
            ).innerHTML =
                slotsToTime(
                    data.normal_residual
                );


            document.getElementById(
                "creative-residual"
            ).innerHTML =
                slotsToTime(
                    data.creative_residual
                );

        }
    );

};


// =========================================
// REST DAY
// =========================================

document.getElementById(
    "rest-day"
).onclick = function() {


    const data = {

        day: currentDay

    };


    fetch(
        "/set_rest_day",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(data)

        }
    )


    .then(
        function(response) {

            return response.json();

        }
    )


    .then(
        function(data) {


            const currentCells =
                document.querySelectorAll(
                    `.quarter-area[data-day="${currentDay}"]`
                );


            currentCells.forEach(
                function(cell) {

                    cell.classList.add(
                        "rest-day-cell"
                    );

                }
            );

        }
    );

};


// =========================================
// STARTING SLOTS
// =========================================

document.getElementById(
    "set-starting-slots"
).onclick = function() {


    const startingSlots =
        Number(
            document.getElementById(
                "starting-slots"
            ).value
        );


    fetch(
        "/set_starting_slots",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                starting_slots:
                    startingSlots

            })

        }
    );

};


// =========================================
// CLEAR CURRENT DAY
// =========================================

document.getElementById(
    "clear-day"
).onclick = function() {


    const currentCells =
        document.querySelectorAll(
            `.quarter-area[data-day="${currentDay}"]`
        );


    currentCells.forEach(
        function(cell) {

            cell.classList.remove(

                "normal-slot",

                "creative-slot",

                "rest-day-cell",

                "selected-slot"

            );

        }
    );


    // Remove merged blocks for this day

    const currentPage =
        document.querySelector(
            `.day-page[data-day="${currentDay}"]`
        );


    if (currentPage) {

        currentPage
            .querySelectorAll(
                ".merged-slot"
            )
            .forEach(
                function(block) {

                    block.remove();

                }
            );

    }

};

</script>

</body>
</html>
